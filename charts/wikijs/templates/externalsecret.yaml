{{- if and (eq .Values.credentials.mode "externalSecret") (include "wikijs.hooksEnabled" .) }}
{{- $es := .Values.credentials.externalSecret }}
{{- /*
     Only the fields the ENABLED features need are requested.

     External Secrets fails the whole ExternalSecret when any one remoteRef
     cannot be resolved, and a failed ExternalSecret creates no Secret at all,
     so the hook jobs then start with nothing mounted. Asking unconditionally
     for a git deploy key on an SSO-only deployment therefore does not degrade
     gracefully — it takes out the credentials the deployment does use.
*/ -}}
{{- $fields := list "admin_email" "admin_password" }}
{{- if .Values.seed.enabled }}
  {{- if eq .Values.seed.authType "basic" }}
    {{- $fields = concat $fields (list "git_username" "git_password") }}
  {{- else }}
    {{- $fields = append $fields "git_deploy_key" }}
  {{- end }}
{{- end }}
{{- if .Values.sso.enabled }}
  {{- $fields = concat $fields (list "oidc_client_id" "oidc_client_secret") }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "wikijs.secretName" . }}
  labels:
    {{- include "wikijs.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ required "credentials.externalSecret.secretStoreRef.name is required" $es.secretStoreRef.name }}
  target:
    name: {{ include "wikijs.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- $key := required "credentials.externalSecret.remoteKey is required" $es.remoteKey }}
    {{- range $field := $fields }}
    - secretKey: {{ $field }}
      remoteRef:
        key: {{ $key }}
        {{- /* properties renames the REMOTE side; unnamed fields use their own name */}}
        property: {{ get $es.properties $field | default $field }}
    {{- end }}
{{- end }}
