{{- if and (eq .Values.credentials.mode "externalSecret") (or .Values.seed.enabled .Values.sso.enabled) }}
{{- $es := .Values.credentials.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "wikijs.secretName" . }}
  labels:
    {{- include "wikijs.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ required "credentials.externalSecret.secretStoreRef.name is required" $es.secretStoreRef.name }}
  target:
    name: {{ include "wikijs.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- $key := required "credentials.externalSecret.remoteKey is required" $es.remoteKey }}
    {{- range $field, $property := $es.properties }}
    - secretKey: {{ $field }}
      remoteRef:
        key: {{ $key }}
        property: {{ $property }}
    {{- end }}
{{- end }}
